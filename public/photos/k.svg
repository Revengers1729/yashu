<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="350" r="280" fill="url(#goldGlow)"/>

  <!-- Ornate Golden Arch Frame -->
  <path d="M 120 900 L 120 400 C 120 180, 680 180, 680 400 L 680 900" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 5" opacity="0.6"/>
  <path d="M 140 900 L 140 410 C 140 210, 660 210, 660 410 L 660 900" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>

  <!-- Romantic Bridal Silhouette Art -->
  <g transform="translate(400, 420)">
    <!-- Red Lehenga Dupatta Flow -->
    <path d="M -160 380 Q -100 120 -10 -40 Q 30 -50 80 -10 Q 140 100 170 380 Z" fill="#9f1239" opacity="0.85"/>
    <path d="M -130 380 Q -80 140 0 -20 Q 30 -30 60 10 Q 110 120 140 380 Z" fill="#be123c" opacity="0.9"/>
    
    <!-- Gold embroidery details -->
    <path d="M -90 140 Q 0 100 90 140" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.8"/>
    <path d="M -110 200 Q 0 160 110 200" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.8"/>
    <path d="M -130 270 Q 0 220 130 270" fill="none" stroke="#fde047" stroke-width="2.5" opacity="0.8"/>
    <path d="M -150 340 Q 0 280 150 340" fill="none" stroke="#fde047" stroke-width="3" opacity="0.85"/>

    <!-- Bridal Face / Profile Glow -->
    <circle cx="10" cy="-110" r="55" fill="#fbcfe8" opacity="0.95"/>
    <!-- Elegant Hair Bun & Maang Tikka -->
    <ellipse cx="25" cy="-140" r="40" rx="35" ry="42" fill="#292524"/>
    <path d="M 10 -165 L 10 -125" stroke="#fde047" stroke-width="3"/>
    <circle cx="10" cy="-120" r="6" fill="#fbbf24"/>
    <!-- Gentle Dupatta Veil draped over head -->
    <path d="M -25 -165 C 20 -190, 75 -150, 85 -90 C 95 -30, 110 100, 120 220" fill="none" stroke="#fbbf24" stroke-width="3.5" opacity="0.9"/>
    <!-- Nath / Nose ring hint -->
    <circle cx="-18" cy="-105" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <line x1="-12" y1="-110" x2="10" y2="-120" stroke="#fde047" stroke-width="1.5"/>
  </g>

  <!-- Typography / Romantic Inscription -->
  <text x="400" y="820" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">MERI DULHAN GUDIYA</text>
  <text x="400" y="860" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#fecdd3" text-anchor="middle" letter-spacing="2">YASH KI HUMSAFAR · HAMESHA KE LIYE</text>
  <text x="400" y="910" font-family="'Sacramento', cursive" font-size="28" fill="#fda4af" text-anchor="middle">"Sirf tum aur sirf tum hi meri dulhan banogi"</text>
</svg>
